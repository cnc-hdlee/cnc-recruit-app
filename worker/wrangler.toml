# Cloudflare Worker - CNC Recruit Cloud (works even when PC is off, fixed URL)
# Deployed URL: https://cnc-recruit.<account>.workers.dev

name = "cnc-recruit"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Static viewer build served at /
# run_worker_first ensures our auth/redirect/snapshot logic runs BEFORE Cloudflare's
# static asset handler — otherwise `?t=token` would hit a cached `/index.html` and
# the auth cookie would never be set.
[assets]
directory = "../dist-viewer"
binding = "ASSETS"
run_worker_first = true

# Cached snapshot (sheets + calendar) - refreshed every 5 minutes by the Cron trigger
[[kv_namespaces]]
binding = "SNAPSHOT_KV"
id = "5a1ee7e6431a42668ccd772aed12b8dd"

# Cron: every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Public configuration: sheet IDs, calendar IDs, mappings.
# Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN, ACCESS_TOKEN)
# are uploaded via `wrangler secret put`.
[vars]
SHEET_IDS = '["1CS2o71Ome6ER_tGx6XhRM2BdXG4spOfEaHWu_CtGobY","1TtCbTyZ9XIItZ08APYNuYbxPppZHN3iAJGiWewmcJGw"]'
