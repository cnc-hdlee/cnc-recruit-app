name: Auto Build & Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Restore .env.production from secrets
        shell: pwsh
        run: |
          @"
          VITE_DEFAULT_GOOGLE_CLIENT_ID=${{ secrets.VITE_DEFAULT_GOOGLE_CLIENT_ID }}
          VITE_DEFAULT_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_DEFAULT_GOOGLE_CLIENT_SECRET }}
          VITE_DEFAULT_SHEETS_CONFIG=${{ secrets.VITE_DEFAULT_SHEETS_CONFIG }}
          "@ | Out-File -FilePath .env.production -Encoding utf8 -NoNewline

      - name: Skip if commit is auto version bump
        id: skipcheck
        shell: pwsh
        run: |
          $msg = git log -1 --pretty=%B
          if ($msg -match '\[skip ci\]' -or $msg -match 'chore: release v') {
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Bump patch version
        if: steps.skipcheck.outputs.skip == 'false'
        id: bump
        shell: pwsh
        run: |
          $newVer = (npm version patch --no-git-tag-version).TrimStart('v')
          echo "version=$newVer" >> $env:GITHUB_OUTPUT
          echo "Bumped to v$newVer"

      - name: Build & Publish to GitHub Releases
        if: steps.skipcheck.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win nsis --x64 --publish always

      - name: Commit version bump back to main
        if: steps.skipcheck.outputs.skip == 'false'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push
