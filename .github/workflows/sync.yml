name: Snapshot Sync & Deploy (Sheets → Cloudflare Pages)

# 5분마다 자동 + main push 시 + 수동 실행
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'electron/**'
      - 'scripts/extract-secrets.cjs'
      - 'README.md'
      - '**.md'
  workflow_dispatch:

# 동시에 두 개 안 돌도록
concurrency:
  group: snapshot-sync-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Fetch snapshot from Sheets + Calendar + Gmail + Slack
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SHEETS_CONFIG: ${{ secrets.SHEETS_CONFIG }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          EXPORTED_BY: github-actions-cron
          OUT_PATH: snapshot.json
        run: node scripts/sync-snapshot.cjs

      # Restore previous alert state from gh-pages so we don't re-notify the same anomaly every 5 min
      - name: Restore alert-state.json from gh-pages
        continue-on-error: true
        run: |
          set -e
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git show origin/gh-pages:alert-state.json > alert-state.json 2>/dev/null || echo '{"sentKeys":{},"lastRunAt":null}' > alert-state.json
          else
            echo '{"sentKeys":{},"lastRunAt":null}' > alert-state.json
          fi

      - name: Detect anomalies (cross-monitor sheets/calendar/gmail/slack)
        env:
          IN_PATH: snapshot.json
          STATE_PATH: alert-state.json
          OUT_PATH: alerts.json
        run: node scripts/detect-anomalies.cjs

      - name: Send alert (Gmail self-mail + optional Slack DM)
        env:
          IN_PATH: alerts.json
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
          SLACK_DM_USER_ID: ${{ secrets.SLACK_DM_USER_ID }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: node scripts/send-alert.cjs

      - name: Build viewer (PWA)
        env:
          VITE_VIEWER_MODE: 'true'
        run: npm run build:viewer

      - name: Bundle snapshot into build
        run: cp snapshot.json dist-viewer/snapshot.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.86.0'
          command: pages deploy dist-viewer --project-name=cnc-recruit-viewer --branch=main --commit-dirty=true --commit-message="auto sync deploy"

      - name: Backup snapshot to gh-pages branch
        continue-on-error: true
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true
          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "[backup] gh-pages 없음 — orphan 생성"
            git checkout --orphan gh-pages-init
            git reset --hard
            cp snapshot.json /tmp/snap.json
            echo '# CNC snapshot backup' > README.md
            git add README.md
            git commit -m "init gh-pages backup"
            git push origin gh-pages-init:gh-pages
            git checkout main
            git fetch origin gh-pages
            cp /tmp/snap.json snapshot.json
          fi

          git worktree add ghp gh-pages
          cp snapshot.json ghp/snapshot.json
          cp alert-state.json ghp/alert-state.json 2>/dev/null || true
          cd ghp
          git add snapshot.json alert-state.json
          if git diff --cached --quiet; then
            echo "[backup] no changes"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin gh-pages
          fi
