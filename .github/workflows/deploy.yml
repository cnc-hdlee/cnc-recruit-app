name: Deploy Viewer to GitHub Pages

# main 브랜치에 push될 때 viewer 빌드 + gh-pages 배포
on:
  push:
    branches: [main]
    paths-ignore:
      - 'electron/**'
      - 'scripts/**'
      - '.github/workflows/sync.yml'
      - 'README.md'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: viewer-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build viewer
        env:
          VITE_VIEWER_MODE: 'true'
        run: npm run build:viewer

      - name: Inject placeholder snapshot if absent
        run: |
          if [ ! -f dist-viewer/snapshot.json ]; then
            echo '{"version":1,"exportedAt":"1970-01-01T00:00:00Z","exportedBy":"placeholder","appName":"CNC 채용 커맨드센터","sheets":{},"mappings":{}}' > dist-viewer/snapshot.json
          fi

      - name: Deploy to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true

          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            # gh-pages 브랜치가 처음이면 origin에 빈 orphan 브랜치 생성
            echo "[deploy] gh-pages 브랜치 첫 생성"
            git push origin --delete gh-pages 2>/dev/null || true
            git checkout --orphan gh-pages-init
            git reset --hard
            echo '# CNC Viewer (placeholder)' > README.md
            git add README.md
            git commit -m "init gh-pages"
            git push origin gh-pages-init:gh-pages
            git checkout main
            git fetch origin gh-pages
          fi

          git worktree add ghp gh-pages
          # 기존 snapshot.json 보존 (sync workflow가 만든 것)
          if [ -f ghp/snapshot.json ]; then
            cp ghp/snapshot.json /tmp/preserved-snapshot.json
          fi

          # 기존 사이트 파일 비우기
          find ghp -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          cp -r dist-viewer/* ghp/

          # sync workflow가 만든 snapshot.json이 있다면 복원
          if [ -f /tmp/preserved-snapshot.json ]; then
            cp /tmp/preserved-snapshot.json ghp/snapshot.json
          fi

          # SPA 라우팅
          cp ghp/index.html ghp/404.html
          touch ghp/.nojekyll

          cd ghp
          git add -A
          if git diff --cached --quiet; then
            echo "[deploy] no changes"
          else
            git commit -m "deploy: viewer build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin gh-pages
          fi
